name: tw-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y build-essential libffi-dev python3-dev curl git
      - run: pip install textworld
      - run: python scripts/tw_probe.py
